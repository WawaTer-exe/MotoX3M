<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Unblocked Games Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: white;
    }

    header {
      background: #1a1a22;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #2a2a35;
    }

    #games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .game {
      background: #1a1a22;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      transition: 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: white;
      display: block;
    }

    .game:hover {
      transform: scale(1.05);
      background: #252533;
    }

    .game img {
      width: 100%;
      border-radius: 8px;
    }

    .game h3 {
      margin: 10px 0 5px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #aaa;
    }
    <img src="https://cdn.dribbble.com/userupload/28405279/file/original-d63788fd2151ab2eb2e78d6c12b7f1dd.gif"
     style="width:100vw;height:100vh;object-fit:cover;">
  </style>
</head>

<body>

  <header>
    🎮 Unblocked Games Hub
  </header>

  <div id="games">

    <!-- MotoX3M Winter -->
    <a href="MotoX3MWinter.html" class="game">
      <img src="https://via.placeholder.com/300x180?text=MotoX3M+Winter" alt="MotoX3M Winter">
      <h3>MotoX3M Winter</h3>
    </a>

    <!-- MotoX3M PoolParty -->
    <a href="MotoX3M5PoolParty.html" class="game">
      <img src="https://via.placeholder.com/300x180?text=MotoX3M+PoolParty" alt="MotoX3M PoolParty">
      <h3>MotoX3M PoolParty</h3>
    </a>

  </div>

  <footer>
    Made for gaming 😎
  </footer>

  <script>
    function openGame(page) {
      window.location.href = "player.html?game=" + page;
    }
  </script>

</body>

</html>
